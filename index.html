<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Евробюджет</title>
<meta name="description" content="Личный учёт доходов и расходов в евро">
<meta name="theme-color" content="#EDF0F4" media="(prefers-color-scheme: light)" id="tcLight">
<meta name="theme-color" content="#0F1520" media="(prefers-color-scheme: dark)" id="tcDark">
<meta name="apple-mobile-web-app-title" content="Евробюджет">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232747D3'/%3E%3Ctext x='32' y='44' font-size='36' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3E€%3C/text%3E%3C/svg%3E">
<script>
/* apply the saved theme before the first paint */
(function(){try{var t=localStorage.getItem('evrobudget.theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);var c=t==='dark'?'#0F1520':'#EDF0F4';document.getElementById('tcLight').content=c;document.getElementById('tcDark').content=c;}}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap">
<style>
/* Calm by subtraction: one main number per screen, lists as quiet blocks, one filled accent control. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F4F6FA; --ink:#172131; --muted:#5D6880; --line:#DCE1EA;
  --accent:#2747D3; --accent-ink:#FFFFFF; --accent-soft:#E3E8FB;
  --pos:#16855A; --warn:#8A5A00; --neg:#C23B34;
  --need:#2747D3; --want:#8A5CF0; --save:#16855A;
  --scrim:rgba(15,21,32,.32);
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  --gutR:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1520; --surface:#172030; --surface-2:#1E2A3C; --ink:#E7ECF4; --muted:#93A0B7; --line:#2A3649;
    --accent:#7D95FF; --accent-ink:#0F1520; --accent-soft:#22305A;
    --pos:#4CC892; --warn:#E8B04A; --neg:#F07870;
    --need:#7D95FF; --want:#B39BFF; --save:#4CC892;
    --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1520; --surface:#172030; --surface-2:#1E2A3C; --ink:#E7ECF4; --muted:#93A0B7; --line:#2A3649;
  --accent:#7D95FF; --accent-ink:#0F1520; --accent-soft:#22305A;
  --pos:#4CC892; --warn:#E8B04A; --neg:#F07870;
  --need:#7D95FF; --want:#B39BFF; --save:#4CC892;
  --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html.locked, html.locked body{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}

/* layout */
.layout{min-height:100vh}
.main{max-width:640px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom, 0px))}
.vbody{padding-left:var(--gut);padding-right:var(--gutR)}
.topbar{position:sticky;top:0;z-index:10;background:var(--bg);min-height:calc(56px + env(safe-area-inset-top, 0px));padding-top:env(safe-area-inset-top, 0px);padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:max(8px, env(safe-area-inset-right, 0px));display:flex;align-items:center;gap:2px;border-bottom:1px solid transparent}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar .title{font-size:22px;font-weight:800;padding:0 8px;flex:1;min-width:0}
.topbar .stitle{font-size:17px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .grow{flex:1}
.mlabel{border:0;background:none;font-size:17px;font-weight:700;padding:0 4px;min-height:44px;white-space:nowrap}
.icon-btn{width:44px;height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center;color:var(--ink);position:relative;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn .dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.back-btn{border:0;background:none;color:var(--accent);font-weight:700;min-height:44px;padding:0 8px 0 2px;display:flex;align-items:center;gap:2px;flex:none}
.top-act{border:0;background:none;color:var(--accent);font-weight:700;min-height:44px;padding:0 8px;flex:none}

/* bottom bar (phone, tablet) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom, 0px);display:grid;grid-template-columns:repeat(5,1fr);padding-left:env(safe-area-inset-left, 0px);padding-right:env(safe-area-inset-right, 0px)}
.tabbar button{border:0;background:none;color:var(--muted);min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;position:relative}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar .plus span{width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.tabbar .dot{position:absolute;top:8px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--warn)}

/* desktop sidebar */
.side{display:none}
@media (min-width:768px) and (max-width:1023px){ .main{max-width:600px} }
@media (min-width:1024px){
  .layout{display:grid;grid-template-columns:232px minmax(0,1fr)}
  .tabbar{display:none}
  .only-phone{display:none!important}
  .side{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;padding:24px 16px;border-right:1px solid var(--line);background:var(--bg);overflow:auto}
  .main{max-width:1024px;width:100%;padding:0 32px 48px}
  .vbody,.topbar{padding-left:0;padding-right:0}
  .topbar{padding-top:16px;min-height:72px}
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px;padding:0 8px}
.brand .mk{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.brand b{font-family:var(--f-display);font-weight:500;font-size:17px}
.side-add{margin-bottom:16px}
.srow{display:flex;align-items:center;gap:12px;min-height:40px;padding:0 10px;border:0;background:none;border-radius:10px;font-weight:600;color:var(--ink);text-align:left;width:100%}
.srow:hover{background:var(--surface-2)}
.srow[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.slabel{font-size:12px;font-weight:700;color:var(--muted);margin:16px 10px 4px}
.side-bottom{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:16px}
.side-status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.side-status .dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}

/* common blocks */
.sec{margin-top:32px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.sec-h h2{font-size:13px;font-weight:700;color:var(--muted)}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:0;min-height:44px;font-size:15px;text-align:left}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:10px 16px;border:0;background:none;text-align:left;color:inherit}
.row + .row{border-top:1px solid var(--line)}
@media (hover:hover){ button.row:hover{background:var(--surface-2)} }
.row .l{min-width:0;flex:1}
.row .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;flex:none}
.row .ramt{font-weight:700;white-space:nowrap}
.row .dt{font-size:13px;color:var(--muted)}
.row.flash{animation:flash 1.2s ease}
@keyframes flash{0%,40%{background:var(--accent-soft)}100%{background:transparent}}
.chev{color:var(--muted);flex:none;display:flex}
.btn{border:0;background:var(--surface-2);color:var(--ink);border-radius:14px;min-height:48px;padding:0 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{filter:brightness(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.wide{width:100%}
.btn.danger{background:none;color:var(--neg)}
.btn:disabled{opacity:.45;cursor:default}
.empty{color:var(--muted);padding:12px 0}
.bar{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.bar.b4{height:4px} .bar.b8{height:8px} .bar.b12{height:12px}
.bar > i.warn{background:var(--warn)} .bar > i.neg{background:var(--neg)} .bar > i.pos{background:var(--pos)}
.input{width:100%;min-height:44px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:16px;min-width:0}
.input:focus{border-color:var(--accent);outline:none}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.flabel{font-size:13px;font-weight:700;color:var(--muted)}
.money-in{position:relative}
.money-in .input{padding-right:32px}
.money-in span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700;pointer-events:none}
.ferr{color:var(--neg);font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.hs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-right:calc(-1 * var(--gutR));padding-right:16px}
.hs::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 14px;border-radius:999px;border:0;background:var(--surface-2);font-weight:600;color:var(--ink);white-space:nowrap;touch-action:manipulation}
.chip.ghost{background:none;border:1px solid var(--line);font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700;border-color:transparent}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:0;gap:0;min-height:44px}
.seg button{flex:1;border:1px solid transparent;border-radius:12px;background:none;font-weight:700;font-size:14px;color:var(--muted);min-height:44px}
.seg button[aria-pressed="true"]{background:var(--surface);border-color:var(--line);color:var(--ink)}
#homeStatus{display:contents}
.lrow{scroll-margin-top:calc(64px + env(safe-area-inset-top, 0px))}
.status-line{display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px;color:var(--muted);border-bottom:1px solid var(--line)}
.status-line p{flex:1;min-width:0}
.status-line.warn p{color:var(--warn)}
.demo-strip{position:sticky;top:calc(56px + env(safe-area-inset-top, 0px));z-index:9;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;margin:0 calc(-1 * var(--gutR)) 0 calc(-1 * var(--gut));background:var(--accent-soft);font-size:14px}
.demo-strip p{flex:1}
mark{background:var(--accent-soft);color:inherit;border-radius:3px}

/* home */
.hero{margin-top:24px}
.hero .lbl{font-size:14px;font-weight:600;color:var(--muted)}
.hero .big{font-family:var(--f-display);font-weight:500;font-size:44px;line-height:1.15;letter-spacing:-.02em}
.hero .sub{color:var(--muted)}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}
.figs .k{font-size:13px;color:var(--muted)}
.figs .v{font-size:17px;font-weight:700}
.goalline{display:flex;align-items:center;gap:8px;min-height:48px;margin-top:16px;border:0;border-top:1px solid var(--line);background:none;width:100%;padding:0;text-align:left}
.goalline .l{flex:1;color:var(--muted)}
.goalline b{font-weight:700;display:flex;align-items:center;gap:6px}
.lim-row{display:block;width:100%;border:0;background:none;text-align:left;padding:8px 0;min-height:48px}
.lim-row .top{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.lim-row .top b{font-weight:600}
.lim-row .top span{font-size:14px;color:var(--muted);white-space:nowrap}
.lim-sub{font-size:13px;color:var(--muted);margin-top:6px}
.lim-list .lim-row{padding:12px 16px}
.lim-list .lim-row + .lim-row{border-top:1px solid var(--line)}
@media (hover:hover){ .lim-list .lim-row:hover{background:var(--surface-2)} }
.bar .mk{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.45;border-radius:1px}
.lim-row .bar{height:6px}
.lim-sub.warn,.lrow .sub.warn{color:var(--warn)} .lim-sub.neg,.lrow .sub.neg{color:var(--neg)}
.home-empty{text-align:center;margin-top:48px;display:flex;flex-direction:column;align-items:center;gap:12px}
.home-empty h2{font-size:20px;font-weight:800}
.home-empty p{color:var(--muted);max-width:32ch}
@media (min-width:1024px){
  .home-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px;align-items:start}
  .hero .big{font-size:48px}
}

/* operations */
.searchbar{position:sticky;top:calc(56px + env(safe-area-inset-top, 0px));z-index:9;background:var(--bg);padding:4px var(--gutR) 8px var(--gut)}
@media (min-width:1024px){ .searchbar{top:72px;padding-left:0;padding-right:0} }
.search{position:relative}
.search .input{padding-left:40px;padding-right:44px;background:var(--surface-2)}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex}
.search .icon-btn{position:absolute;right:0;top:0}
.sumline{font-size:14px;color:var(--muted);margin:12px 0}
.dayh{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;color:var(--muted);margin:20px 0 8px}
.dayh span{font-weight:500}
.monthh{display:flex;justify-content:space-between;gap:8px;margin:28px 0 0;font-weight:700}
.monthh span{font-size:13px;font-weight:500;color:var(--muted)}
.cat-row{display:block;width:100%;border:0;background:none;text-align:left;padding:8px 0;min-height:44px}
.cat-row .top{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.cat-row .top b{font-weight:700}
.cat-row .top small{color:var(--muted);font-size:13px;margin-left:6px;font-weight:500}
.stack{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.stack i{display:block;height:100%}
.rule{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px 12px;align-items:center;margin-top:12px}
.rule .d{width:10px;height:10px;border-radius:3px}
.rule .tg{font-size:13px;color:var(--muted)}

/* goals */
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
button.block{width:100%;text-align:left;color:inherit;display:block}
.segs6{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:10px 0 8px}
.segs6 div{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.segs6 i{display:block;height:100%;background:var(--accent)}
.goal-row{display:block;width:100%;border:0;background:none;text-align:left;padding:14px 16px;min-height:88px;color:inherit}
.goal-row + .goal-row{border-top:1px solid var(--line)}
@media (hover:hover){ .goal-row:hover{background:var(--surface-2)} }
.goal-row .top{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.goal-row .top b{font-size:16px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal-row .top span{font-size:14px;color:var(--muted);white-space:nowrap}
.gstat{font-size:14px;margin-top:8px;display:flex;align-items:center;gap:6px}

/* more */
.glist{display:flex;flex-direction:column;gap:24px;margin-top:8px}
.ghead{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 8px 4px}
.mrow{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 16px;border:0;background:none;text-align:left;color:inherit}
.mrow + .mrow{border-top:1px solid var(--line)}
@media (hover:hover){ .mrow:hover{background:var(--surface-2)} }
.mrow .l{flex:1;min-width:0}
.mrow .m{font-size:14px;color:var(--muted)}
.mrow .m.warn{color:var(--warn)}
.foot{font-size:13px;color:var(--muted);text-align:center;margin-top:24px}
.lrow{padding:12px 16px}
.lrow + .lrow{border-top:1px solid var(--line)}
.lrow > button{display:block;width:100%;border:0;background:none;text-align:left;padding:0;color:inherit;min-height:44px}
.lrow .top{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.lrow .top b{font-weight:600}
.lrow .top span{font-size:14px;color:var(--muted);white-space:nowrap}
.lrow .sub{font-size:13px;color:var(--muted);margin-top:6px}
.advice{background:var(--surface-2);border-radius:12px;padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.adv-line{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.adv-line span{color:var(--muted)}
.adv-warn{color:var(--warn);font-weight:600}
.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;max-width:62ch}
.basket{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.basket ul{list-style:none;margin:0;padding:0}
.basket li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
.basket li b{white-space:nowrap}
.bedit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.calc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.calc-out{margin-top:16px;display:flex;flex-direction:column;gap:6px}
.split{display:flex;height:10px;border-radius:999px;overflow:hidden}
.split i:first-child{background:var(--accent)} .split i:last-child{background:var(--pos)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;max-width:62ch}
.acct{display:flex;align-items:center;gap:12px}
.acct img{width:40px;height:40px;border-radius:50%}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;min-height:48px;padding:0 18px;font-weight:700}
.gbtn:disabled{opacity:.55;cursor:default}
.gbtn svg{width:18px;height:18px}
.stack-v{display:flex;flex-direction:column;gap:12px}
.big32{font-family:var(--f-display);font-weight:500;font-size:32px;letter-spacing:-.02em;line-height:1.2}

/* standalone calculator */
.calc-disp{text-align:right;padding:24px 4px 16px;min-height:120px;display:flex;flex-direction:column;justify-content:flex-end}
.calc-disp .ex{font-size:17px;color:var(--muted);white-space:nowrap;overflow:hidden;direction:ltr}
.calc-disp .er{font-size:15px;color:var(--neg);min-height:22px}
.calc-disp .rs{font-family:var(--f-display);font-weight:500;font-size:44px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

  #sheet[open],#sheet.closing,#sheet::backdrop{animation:none}

}

/* ---------- data model ----------
   tx   = {id,type,cat,amount,date,note,ts}
   goal = {id,name,target,base,ops:{opId:delta},created,due?:'YYYY-MM',plan?:{ym,base},saved} */
function defaultSettings(){return {budgets:{},goals:[],reserve:0}}
let live = {months:{}, settings:defaultSettings()};
let demo = null;
const D = () => demo || live;
const S = {mode:'loading', loaded:false, cur:ymOf(todayISO), editBud:false, advOpen:null, basketOpen:false, confirmOut:false,
  q:'', qLimit:100, catFilter:null, draft:null, scroll:{}, lastRoute:'', prevKey:'', flashId:null};
const KEY='evrobudget.v1', OKEY='evrobudget.outbox', UKEY='evrobudget.syncedUid';
let lastSaveFailed=false, importPending=null, dataVer=0;

function goalSaved(g){ let s=g.base||0; for(const k in (g.ops||{})) s+=g.ops[k]; return Math.max(0,s); }
function normTx(x,id){
  if(!x || typeof x.amount!=='number' || !(x.amount>0) || !/^\d{4}-\d{2}-\d{2}$/.test(String(x.date)) || !['income','expense','saving'].includes(x.type)) return null;
  return {id:String(id||x.id||uid8()),type:x.type,cat:String(x.cat||'other'),amount:Math.round(x.amount),date:x.date,note:String(x.note||'').slice(0,80),ts:Number(x.ts)||0};
}
function normGoal(g,id){
  if(!g || typeof g!=='object' || !g.name) return null;
  const ops={}; if(g.ops && typeof g.ops==='object') for(const k in g.ops){ const v=Math.round(Number(g.ops[k])||0); if(v) ops[String(k)]=v; }
  const hasNew = g.ops!=null || g.base!=null;
  const o={id:String(id||g.id||uid8()),name:String(g.name).slice(0,40),target:Math.max(0,Math.round(Number(g.target)||0)),
    base:Math.max(0,Math.round(Number(hasNew?g.base:g.saved)||0)),ops,created:Number(g.created)||0};
  if(typeof g.due==='string' && /^\d{4}-\d{2}$/.test(g.due)) o.due=g.due;
  if(g.plan && typeof g.plan==='object' && /^\d{4}-\d{2}$/.test(String(g.plan.ym)) && isFinite(Number(g.plan.base)) && Number(g.plan.base)>=0) o.plan={ym:g.plan.ym, base:Math.round(Number(g.plan.base))};
  o.saved=goalSaved(o); return o;
}
function normSettings(s){
  const o=defaultSettings(); if(!s || typeof s!=='object') return o;
  if(s.budgets && typeof s.budgets==='object') for(const k in s.budgets){ const v=Math.round(Number(s.budgets[k])); if(v>0) o.budgets[k]=v; }
  let gs=[];
  if(Array.isArray(s.goals)) gs=s.goals.map((g,i)=>{ const n=normGoal(g); if(n && !n.created) n.created=i+1; return n; });
  else if(s.goals && typeof s.goals==='object') gs=Object.keys(s.goals).map(id=>normGoal(s.goals[id],id));
  o.goals=gs.filter(Boolean).sort((a,b)=>(a.created-b.created)||(a.id<b.id?-1:1));
  o.reserve=Math.max(0,Math.round(Number(s.reserve)||0));
  return o;
}
function normalize(d){
  const out={months:{},settings:defaultSettings()};
  if(!d || typeof d!=='object') return out;
  if(d.months && typeof d.months==='object') for(const k in d.months){
    const src=d.months[k]; const list=Array.isArray(src)?src:Object.values(src||{});
    for(const x of list){ const t=normTx(x); if(t){ const ym=ymOf(t.date); (out.months[ym]||(out.months[ym]=[])).push(t); } }
  }
  out.settings=normSettings(d.settings);
  return out;
}
const txOut = t => ({type:t.type,cat:t.cat,amount:t.amount,date:t.date,note:t.note||'',ts:t.ts||0});
function goalOut(g){ const o={name:g.name,target:g.target,base:g.base||0,ops:g.ops||{},created:g.created||0}; if(g.due) o.due=g.due; if(g.plan) o.plan={ym:g.plan.ym,base:g.plan.base}; return o; }
function packSettings(s){ return {budgets:s.budgets,reserve:s.reserve,goals:s.goals.map(g=>Object.assign({id:g.id},goalOut(g)))}; }

function saveLocal(){
  dataVer++;
  if(demo) return;
  if(!lsSet(KEY, JSON.stringify({v:3,months:live.months,settings:packSettings(live.settings)}))){
    if(!lastSaveFailed) toast('Не удалось сохранить в браузере. Скачайте резервную копию.');
    lastSaveFailed=true;
  } else lastSaveFailed=false;
}
function loadLocal(){
  try{ const raw=localStorage.getItem(KEY); live=normalize(raw?JSON.parse(raw):null); S.mode='live'; }
  catch(e){ S.mode='nodb'; }
  S.loaded=true; dataVer++;
}

/* ---------- cloud: Firebase (Google sign-in + Firestore) ----------
   users/{uid}/months/{YYYY-MM} = {tx:{<id>:tx}}
   users/{uid}/meta/settings    = {budgets, reserve, goals:{<id>:goal}} — every write is a field-level merge */
const C = {Au:null, Fs:null, auth:null, db:null, user:null, state:'loading', err:'',
  unsub:[], got:{months:false,settings:false}, meta:{months:null,settings:null}, remoteMonths:{}, remoteSettings:null,
  migrated:false, pending:false, lastSig:null, signingIn:false};
const UA = navigator.userAgent||'';
const IOS = /iP(hone|ad|od)/.test(UA) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const ANDROID = /Android/i.test(UA);
const STANDALONE = navigator.standalone===true || !!(window.matchMedia && matchMedia('(display-mode: standalone)').matches);
const INAPP = /FBAN|FBAV|Instagram|Telegram|WhatsApp|Line\/|; wv\)/i.test(UA);

async function initCloud(){
  try{
    const base='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
    const [A,Au,Fs]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
    C.Au=Au; C.Fs=Fs;
    const app=A.initializeApp(FIREBASE_CONFIG);
    try{ C.db=Fs.initializeFirestore(app,{localCache:Fs.persistentLocalCache({tabManager:Fs.persistentMultipleTabManager()})}); }
    catch(e){ C.db=Fs.getFirestore(app); }
    C.auth=Au.getAuth(app);
    Au.onAuthStateChanged(C.auth, onUser, ()=>{});
  }catch(e){
    C.state='error'; C.err='Не удалось загрузить вход через Google. Проверьте интернет и обновите страницу. Пока записи сохраняются на этом устройстве.';
    render();
  }
}
const monthRef = ym => C.Fs.doc(C.db,'users',C.user.uid,'months',ym);
const settingsRef = () => C.Fs.doc(C.db,'users',C.user.uid,'meta','settings');
function stopListeners(){ for(const f of C.unsub){ try{ f(); }catch(e){} } C.unsub=[]; C.got={months:false,settings:false}; C.migrated=false; C.lastSig=null; C.pending=false; }
function onUser(u){
  stopListeners();
  C.user=u||null; C.err=''; S.confirmOut=false;
  if(!u){ C.state='signedout'; render(); return; }
  C.state='ready'; render();
  const Fs=C.Fs, opts={includeMetadataChanges:true};
  C.unsub.push(Fs.onSnapshot(Fs.collection(C.db,'users',u.uid,'months'),opts,snap=>{
    const m={}; snap.forEach(doc=>{ m[doc.id]=doc.data(); });
    C.remoteMonths=m; C.meta.months=snap.metadata; C.got.months=true; applyRemote();
  },listenErr));
  C.unsub.push(Fs.onSnapshot(settingsRef(),opts,snap=>{
    C.remoteSettings=snap.exists()?snap.data():null; C.meta.settings=snap.metadata; C.got.settings=true; applyRemote();
  },listenErr));
}
function listenErr(e){
  const c=e&&e.code||'';
  C.err = c==='permission-denied'
    ? 'Этот аккаунт Google не может открыть данные Евробюджета. Выйдите и войдите тем аккаунтом, которым входили в первый раз.'
    : 'Синхронизация остановилась ('+(c||'ошибка')+'). Обновите страницу. Записи пока сохраняются на этом устройстве.';
  render();
}
function writeErr(e){
  const c=e&&e.code||'';
  toast(c==='permission-denied' ? 'Нет доступа к хранилищу для этого аккаунта Google.'
    : c==='resource-exhausted' ? 'Бесплатный дневной лимит хранилища исчерпан. Изменения отправятся позже.'
    : 'Не удалось отправить изменение ('+(c||'ошибка')+').');
}
function remoteData(){
  const months={};
  for(const ym in C.remoteMonths){ const tx=(C.remoteMonths[ym]||{}).tx||{}; for(const id in tx){ const t=normTx(tx[id],id); if(t){ const k=ymOf(t.date); (months[k]||(months[k]=[])).push(t); } } }
  for(const k in months) months[k].sort((a,b)=>a.id<b.id?-1:1);
  return {months, settings:normSettings(C.remoteSettings)};
}
function applyRemote(){
  if(!C.got.months || !C.got.settings) return;
  const fromCache = C.meta.months.fromCache || C.meta.settings.fromCache;
  C.pending = C.meta.months.hasPendingWrites || C.meta.settings.hasPendingWrites;
  if(!C.migrated){
    if(fromCache){ renderChrome(); return; }
    C.migrated=true;
    if(migrateLocal()){ renderChrome(); return; }
  }
  const next=remoteData();
  const sig=JSON.stringify([next.months,packSettings(next.settings)]);
  if(sig!==C.lastSig){ C.lastSig=sig; live=next; saveLocal(); renderKeepInput(); }
  else renderChrome();
}
function migrateLocal(){
  let wrote=false;
  const prev=lsGet(UKEY);
  if(prev && prev!==C.user.uid){
    // the local copy belongs to another Google account: never copy it into this one
    lsDel(OKEY); lsSet(UKEY,C.user.uid); return false;
  }
  if(!prev){
    const r=remoteData(), ids=new Set();
    for(const ym in r.months) for(const t of r.months[ym]) ids.add(t.id);
    const byMonth={};
    for(const ym in live.months) for(const t of live.months[ym]) if(!ids.has(t.id)){ const k=ymOf(t.date); (byMonth[k]||(byMonth[k]={}))[t.id]=txOut(t); }
    for(const ym in byMonth){ run(()=>C.Fs.setDoc(monthRef(ym),{tx:byMonth[ym]},{merge:true})); wrote=true; }
    const patch={}, rs=r.settings, ls=live.settings;
    for(const k in ls.budgets) if(!(k in rs.budgets)) (patch.budgets||(patch.budgets={}))[k]=ls.budgets[k];
    const rg=new Set(rs.goals.map(g=>g.id));
    for(const g of ls.goals) if(!rg.has(g.id)) (patch.goals||(patch.goals={}))[g.id]=goalOut(g);
    if((!C.remoteSettings || C.remoteSettings.reserve==null) && ls.reserve>0) patch.reserve=ls.reserve;
    if(Object.keys(patch).length){ run(()=>C.Fs.setDoc(settingsRef(),patch,{merge:true})); wrote=true; }
    lsSet(UKEY,C.user.uid);
  }
  let box=[]; try{ box=JSON.parse(lsGet(OKEY)||'[]'); }catch(e){}
  for(const op of box){ if(CW[op.k]){ run(()=>CW[op.k].apply(null, op.k==='replace'?[normalize(op.a[0])]:op.a)); wrote=true; } }
  lsDel(OKEY);
  return wrote;
}
function run(fn){ try{ const p=fn(); if(p && p.catch) p.catch(writeErr); }catch(e){ writeErr(e); } }
const nullToDel = f => { const o={}; for(const k in f) o[k] = f[k]===null ? C.Fs.deleteField() : f[k]; return o; };
const CW = {
  addTx:t=>C.Fs.setDoc(monthRef(ymOf(t.date)),{tx:{[t.id]:txOut(t)}},{merge:true}),
  delTx:(ym,id)=>C.Fs.setDoc(monthRef(ym),{tx:{[id]:C.Fs.deleteField()}},{merge:true}),
  moveTx:(oldYm,t)=>{ const b=C.Fs.writeBatch(C.db);
    b.set(monthRef(oldYm),{tx:{[t.id]:C.Fs.deleteField()}},{merge:true});
    b.set(monthRef(ymOf(t.date)),{tx:{[t.id]:txOut(t)}},{merge:true});
    return b.commit(); },
  budgets:patch=>{ const b={}; for(const k in patch) b[k]=patch[k]>0?patch[k]:C.Fs.deleteField(); return C.Fs.setDoc(settingsRef(),{budgets:b},{merge:true}); },
  reserve:v=>C.Fs.setDoc(settingsRef(),{reserve:v},{merge:true}),
  goalAdd:g=>C.Fs.setDoc(settingsRef(),{goals:{[g.id]:goalOut(g)}},{merge:true}),
  goalEdit:(id,f)=>C.Fs.setDoc(settingsRef(),{goals:{[id]:nullToDel(f)}},{merge:true}),
  goalOp:(id,opId,delta)=>C.Fs.setDoc(settingsRef(),{goals:{[id]:{ops:{[opId]:delta}}}},{merge:true}),
  goalOpDel:(id,opId)=>C.Fs.setDoc(settingsRef(),{goals:{[id]:{ops:{[opId]:C.Fs.deleteField()}}}},{merge:true}),
  goalDel:id=>C.Fs.setDoc(settingsRef(),{goals:{[id]:C.Fs.deleteField()}},{merge:true}),
  replace:data=>{
    const Fs=C.Fs, b=Fs.writeBatch(C.db);
    for(const ym in C.remoteMonths) if(!data.months[ym]) b.delete(monthRef(ym));
    for(const ym in data.months){ const tx={}; for(const t of data.months[ym]) tx[t.id]=txOut(t); b.set(monthRef(ym),{tx}); }
    const goals={}; for(const g of data.settings.goals) goals[g.id]=goalOut(g);
    b.set(settingsRef(),{budgets:data.settings.budgets,reserve:data.settings.reserve,goals});
    return b.commit();
  }
};
function outboxPush(ops){ let box=[]; try{ box=JSON.parse(lsGet(OKEY)||'[]'); }catch(e){} box.push(...ops); lsSet(OKEY,JSON.stringify(box.slice(-3000))); }
function send(k,...a){
  if(demo) return;
  if(C.user && C.Fs && C.migrated && !C.err) run(()=>CW[k](...a));
  else if(k==='moveTx') outboxPush([{k:'delTx',a:[a[0],a[1].id]},{k:'addTx',a:[a[1]]}]);   // every version knows these two
  else outboxPush([{k,a}]);
}

/* ---------- store ---------- */
function after(){ saveLocal(); render(); }
function addTx(tx){ const d=D(), ym=ymOf(tx.date); (d.months[ym]||(d.months[ym]=[])).push(tx); send('addTx',tx); after(); }
function findTx(id){ const d=D(); for(const ym in d.months){ const t=d.months[ym].find(x=>x.id===id); if(t) return t; } return null; }
function removeTx(tx){
  const d=D(), ym=ymOf(tx.date), arr=d.months[ym]||[], i=arr.findIndex(t=>t.id===tx.id);
  if(i<0) return false;
  arr.splice(i,1); if(!arr.length) delete d.months[ym];
  send('delTx',ym,tx.id); after(); return true;
}
function updateTx(old,next){
  const d=D(), oym=ymOf(old.date), nym=ymOf(next.date);
  const arr=d.months[oym]||[]; const i=arr.findIndex(t=>t.id===old.id); if(i<0) return false;
  if(oym===nym){ arr[i]=next; send('addTx',next); }
  else { arr.splice(i,1); if(!arr.length) delete d.months[oym]; (d.months[nym]||(d.months[nym]=[])).push(next); send('moveTx',oym,next); }
  after(); return true;
}
function setBudgets(nb){
  const d=D(), ob=d.settings.budgets||{}, patch={};
  for(const k of new Set([...Object.keys(ob),...Object.keys(nb)])) if((ob[k]||0)!==(nb[k]||0)) patch[k]=nb[k]||0;
  d.settings.budgets=nb; if(Object.keys(patch).length) send('budgets',patch); after();
}
function setReserve(v){ D().settings.reserve=v; send('reserve',v); after(); }
function findGoal(id){ return (D().settings.goals||[]).find(x=>x.id===id)||null; }
function addGoal(name,target,base,due){
  const g={id:uid8(),name,target,base:base||0,ops:{},created:Date.now()};
  if(due){ g.due=due; g.plan={ym:ymOf(todayISO),base:g.base}; }
  g.saved=goalSaved(g); D().settings.goals.push(g); send('goalAdd',g); after(); return g;
}
function restoreGoal(g){ if(!g) return; const c=clone(g); c.saved=goalSaved(c); const d=D(); if(!findGoal(c.id)) d.settings.goals.push(c); d.settings.goals.sort((a,b)=>(a.created-b.created)); send('goalAdd',c); after(); }
function goalEdit(id,f){
  const g=findGoal(id); if(!g) return false;
  for(const k in f){ if(f[k]===null) delete g[k]; else g[k]=clone(f[k]); }
  g.saved=goalSaved(g); send('goalEdit',id,f); after(); return true;
}
function goalChange(id,delta){
  const g=findGoal(id); if(!g){ render(); return null; }
  const opId=uid8(); g.ops[opId]=delta; g.saved=goalSaved(g); send('goalOp',id,opId,delta); after(); return opId;
}
function goalOpDel(id,opId){ const g=findGoal(id); if(!g) return; delete g.ops[opId]; g.saved=goalSaved(g); send('goalOpDel',id,opId); after(); }
function removeGoal(id){ const d=D(); d.settings.goals=d.settings.goals.filter(x=>x.id!==id); send('goalDel',id); after(); }
function replaceAll(data){ demo=null; live=data; send('replace',{months:data.months,settings:packSettings(data.settings)}); after(); }

/* ---------- derived ---------- */
function monthTx(ym){ return (D().months[ym]||[]).slice(); }
function allTx(){ const out=[]; const d=D(); for(const ym in d.months) out.push(...d.months[ym]); return out; }
const byNewest = (a,b) => a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0);
function totals(ym){
  const t={inc:0,exp:0,sav:0,need:0,want:0,byCat:{},n:0};
  for(const x of monthTx(ym)){
    t.n++;
    if(x.type==='income') t.inc+=x.amount;
    else if(x.type==='saving') t.sav+=x.amount;
    else { t.exp+=x.amount; const g=(CAT[x.cat]||{}).group||'want'; t[g==='need'?'need':'want']+=x.amount; t.byCat[x.cat]=(t.byCat[x.cat]||0)+x.amount; }
  }
  return t;
}
function hasData(){ const d=D(); return Object.values(d.months).some(a=>a&&a.length) || d.settings.goals.length>0 || d.settings.reserve>0 || Object.values(d.settings.budgets).some(v=>v>0); }
function avgExpenses(){
  const vals=[], start=shiftYm(ymOf(todayISO),-1);
  for(let i=0;i<12 && vals.length<3;i++){ const e=totals(shiftYm(start,-i)).exp; if(e>0) vals.push(e); }
  if(!vals.length){ const cur=ymOf(todayISO), e=totals(cur).exp; if(e>0){ const [y,m]=cur.split('-').map(Number); vals.push(e/now.getDate()*new Date(y,m,0).getDate()); } }
  return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
}
function monthCtx(ym){
  const [y,m]=ym.split('-').map(Number); const last=new Date(y,m,0).getDate(); const curYm=ymOf(todayISO);
  if(ym===curYm) return {state:'cur',daysLeft:last-now.getDate()+1,daysPassed:now.getDate(),last};
  return ym<curYm ? {state:'past',daysLeft:0,daysPassed:last,last} : {state:'future',daysLeft:last,daysPassed:0,last};
}
function limitInfo(id){
  const b=D().settings.budgets||{}; const lim=b[id]; if(!(lim>0)) return null;
  const spent=totals(S.cur).byCat[id]||0; const p=spent/lim;
  const ctx=monthCtx(S.cur), norm=lim/ctx.last;
  const planToDate = ctx.state==='cur' ? norm*ctx.daysPassed : ctx.state==='past' ? lim : 0;
  const ahead = planToDate-spent;   // >0 in reserve, <0 above plan
  const st = p>1 ? 'neg' : (ctx.state==='cur' && ahead<-100) || p>=.9 ? 'warn' : '';
  return {id,lim,spent,rest:lim-spent,p,st,norm,week:norm*7,planToDate,ahead,ctx};
}
function limitBar(li,cls){
  const bar=el('div','bar '+(cls||'')); bar.style.position='relative';
  const fi=el('i',li.st); fi.style.width=Math.min(100,li.p*100)+'%'; bar.append(fi);
  if(li.ctx.state==='cur' && li.rest>=0){ const mk=el('span','mk'); mk.style.left='calc('+Math.min(100,li.planToDate/li.lim*100)+'% - 1px)'; mk.title='План к сегодняшнему дню'; bar.append(mk); }
  return bar;
}
/* one short line under a limit: norm per day, and whether we are within plan */
function limitNote(li){
  if(li.rest<0) return {t:'превышен на '+money0(-li.rest), c:'neg'};
  const n='норма '+money(li.norm)+' в день';
  if(li.ctx.state!=='cur') return {t:n, c:''};
  if(li.ahead>=0) return {t:n+' · в запасе '+money0(li.ahead), c:''};
  return {t:'выше плана на '+money0(-li.ahead)+' · '+n, c:'warn'};
}
function limitsSorted(){ const b=D().settings.budgets||{}; return Object.keys(b).filter(k=>b[k]>0).map(limitInfo).sort((a,b)=>b.p-a.p); }

/* goals: schedule against the real current month */
function goalInfo(g){
  const Cm=ymOf(todayISO), T=g.target, Sv=g.saved, Dd=g.due||null;
  const r={T,S:Sv,D:Dd,state:'',planMonthly:0,needNow:0,leftThisMonth:0,monthsLeft:0};
  if(Sv>=T){ r.state='done'; return r; }
  if(!Dd){ r.state='nodue'; return r; }
  const plan=g.plan||{ym:Cm,base:Sv}; const P0=plan.ym, B=Math.min(plan.base,T);
  const total=Math.max(1, idx(Dd)-idx(P0)+1);
  r.planMonthly=ceilEuro((T-B)/total);
  const passed=Math.min(total, Math.max(0, idx(Cm)-idx(P0)));
  const expStart=B+(T-B)*passed/total, expEnd=B+(T-B)*Math.min(total,passed+1)/total;
  r.monthsLeft=idx(Dd)-idx(Cm)+1;
  if(idx(Cm)>idx(Dd)){ r.state='overdue'; return r; }
  r.needNow=ceilEuro((T-Sv)/r.monthsLeft);
  r.leftThisMonth=Math.max(0, ceilEuro(expEnd-Sv));
  if(idx(Cm)===idx(Dd)){ r.state='last'; return r; }
  const tol=Math.max(100, 0.1*r.planMonthly);
  r.state = Sv < expStart-tol ? 'behind' : 'ontrack';
  return r;
}
function goalDueThisMonth(g,i){ i=i||goalInfo(g); return i.state==='ontrack'?i.leftThisMonth : i.state==='behind'?Math.min(i.needNow,i.T-i.S) : i.state==='last'?i.T-i.S : 0; }
function goalsMonthSummary(){
  let sum=0, counted=0;
  for(const g of D().settings.goals){ const i=goalInfo(g); if(['ontrack','behind','last'].includes(i.state)){ counted++; sum+=goalDueThisMonth(g,i); } }
  return counted ? {sum} : null;
}
function goalStatusLine(g){
  const i=goalInfo(g), Cm=ymOf(todayISO);
  const box=el('div','gstat');
  const ck=()=>{ const s=el('span','pos'); s.innerHTML=I('check',18); return s; };

/* frequent purchases: groups of type+category+note used at least twice in the last 90 days */
function freqChips(type){
  const from=isoOf(new Date(now.getFullYear(),now.getMonth(),now.getDate()-90));
  const g=new Map();
  for(const t of allTx()){
    if(t.type!==type || t.date<from || !t.note || !t.note.trim()) continue;
    const key=t.type+'|'+t.cat+'|'+normTxt(t.note);
    const e=g.get(key)||{cat:t.cat,uses:[],note:t.note.trim()};
    e.uses.push(t); g.set(key,e);
  }
  const own=[...g.entries()].filter(([,e])=>e.uses.length>=2).map(([key,e])=>{
    e.uses.sort(byNewest); const last3=e.uses.slice(0,3).map(u=>u.amount);
    let typical=null; for(const a of last3) if(last3.filter(x=>x===a).length>=2){ typical=a; break; }
    return {key,cat:e.cat,note:e.uses[0].note.trim(),amount:typical,count:e.uses.length,lastDate:e.uses[0].date,lastTs:e.uses[0].ts||0};
  }).sort((a,b)=>b.count-a.count || (a.lastDate<b.lastDate?1:a.lastDate>b.lastDate?-1:b.lastTs-a.lastTs)).slice(0,6);
  if(type==='expense' && own.length<3){
    const starters=[['groceries','Lidl'],['groceries','Aldi'],['cafe','Кофе'],['health','Аптека']];
    for(const [cat,note] of starters){ const key='expense|'+cat+'|'+normTxt(note); if(!own.some(o=>o.key===key) && own.length<6) own.push({key,cat,note,amount:null,starter:true}); }
  }
  return own;
}
function catOrder(type){

  const cnt={}; for(const t of allTx()) if(t.type===type && t.date>=from) cnt[t.cat]=(cnt[t.cat]||0)+1;
  const base=CATS[type].map(c=>c[0]);

/* ---------- calculator engine ---------- */
const OPS=['+','−','×','÷'];
const isOp = x => OPS.includes(x);
function numCents(s){ const neg=s.startsWith('-'); const b=(neg?s.slice(1):s).replace('%',''); const parts=b.split(','); const v=Number(parts[0]||0)*100+Number(((parts[1]||'')+'00').slice(0,2)); return neg?-v:v; }
function centsStr(c){ const neg=c<0; c=Math.abs(c); const e=Math.floor(c/100), r=c%100; return (neg?'-':'')+e+(r?','+pad(r).replace(/0$/,''):''); }
function evalPart(t){
  const vals=[], ops=[];
  for(let i=0;i<t.length;i++){
    if(i%2===0){
      const s=t[i];
      if(s.endsWith('%')){
        const p=numCents(s);
        if(i===0) vals.push(p/100);
        else { const op=t[i-1]; if(op==='+'||op==='−'){ const left=evalPart(t.slice(0,i-1)); if(left.err) return left; vals.push(left.raw*p/10000); } else vals.push(p/100); }
      } else vals.push(numCents(s));
    } else ops.push(t[i]);
  }
  const v=[vals[0]], o=[];
  for(let i=0;i<ops.length;i++){ const op=ops[i], b=vals[i+1];
    if(op==='×') v[v.length-1]=v[v.length-1]*b/100;
    else if(op==='÷'){ if(b===0) return {err:'Деление на ноль'}; v[v.length-1]=v[v.length-1]/b*100; }
    else { o.push(op); v.push(b); } }
  let r=v[0]; for(let i=0;i<o.length;i++) r = o[i]==='+' ? r+v[i+1] : r-v[i+1];
  const cents=Math.round(r); return {raw:r, cents, approx:Math.abs(r-cents)>1e-6};
}
function evaluate(toks){ const t=toks.slice(); while(t.length && isOp(t[t.length-1])) t.pop(); if(!t.length) return {empty:true,cents:0}; return evalPart(t); }
/* mode 'amount' (positive sums for entry) or 'calc' (standalone, with % and =) */
function Calc(mode,onChange){
  const c={toks:[],replace:false,mode,hint:'',hintTimer:null};
  c.changed=()=>{ if(onChange) onChange(c); };
  c.setCents=(cents,replace)=>{ c.toks=cents>0?[replace?Math.floor(cents/100)+','+pad(cents%100):centsStr(cents)]:[]; c.replace=!!replace && cents>0; c.changed(); };
  c.clear=()=>{ c.toks=[]; c.replace=false; c.changed(); };
  c.flash=msg=>{ c.hint=msg; clearTimeout(c.hintTimer); c.hintTimer=setTimeout(()=>{ c.hint=''; c.changed(); },2000); };
  c.hasOps=()=>c.toks.some(isOp);
  c.res=()=>{
    const r=evaluate(c.toks);
    if(r.empty) return r;
    if(r.err) return r;
    if(mode==='amount'){
      if(r.cents<=0) return Object.assign(r,{err:'Сумма должна быть больше нуля'});
      if(r.cents>100000000) return Object.assign(r,{err:'Слишком большая сумма. Проверьте, нет ли лишних нулей'});
    }
    return r;
  };
  c.press=k=>{ press(k); c.changed(); };
  function press(k){
    const T=c.toks;
    if(k==='C'){ c.toks=[]; c.replace=false; return; }
    if(k==='⌫'){ if(c.replace){ c.replace=false; } if(!T.length) return; const last=T[T.length-1];
      if(isOp(last)) T.pop(); else { const s=last.slice(0,-1); if(s===''||s==='-') T.pop(); else T[T.length-1]=s; } return; }
    if(k==='='){ if(mode!=='calc') return; const r=evaluate(T); if(r.empty||r.err) return; c.toks = r.cents===0?[]:[centsStr(r.cents)]; return; }
    if(T.join('').length>=40 && k!=='⌫') return;
    if(isOp(k)){ c.replace=false;
      if(!T.length){ if(mode==='calc' && k==='−') c.toks=['0','−']; return; }
      if(isOp(T[T.length-1])) T[T.length-1]=k; else T.push(k); return; }
    if(k==='%'){ if(mode!=='calc') return; const last=T[T.length-1]; if(!last||isOp(last)||last.endsWith('%')) return; T[T.length-1]=last.replace(/,$/,'')+'%'; return; }
    if(c.replace){ c.toks=[]; c.replace=false; }
    const TT=c.toks; const last=TT[TT.length-1];
    if(last===undefined||isOp(last)){ TT.push(k===','?'0,':k); return; }
    if(last.endsWith('%')) return;
    if(k===','){ if(last.includes(',')) return; TT[TT.length-1]=last+','; return; }
    const neg=last.startsWith('-'), body=neg?last.slice(1):last; const parts=body.split(',');
    if(parts.length>1){ if(parts[1].length>=2){ c.flash('Не больше 2 знаков после запятой'); return; } TT[TT.length-1]=last+k; return; }
    if(parts[0]==='0'){ TT[TT.length-1]=(neg?'-':'')+k; return; }
    if(parts[0].length>=7) return;
    TT[TT.length-1]=last+k;
  }
  return c;
}

  for(const w of words){ if(!w) continue; let i=norm.indexOf(w); while(i>=0){ for(let k=i;k<i+w.length;k++) marks[k]=true; i=norm.indexOf(w,i+w.length); } }
  let buf='', on=false;
  const flush=()=>{ if(!buf) return; if(on){ const m=el('mark',null,buf); node.append(m); } else node.append(document.createTextNode(buf)); buf=''; };

}

function searchMatches(q){
  const nq=normTxt(q); const compact=nq.replace(/\s/g,'');
  let list=allTx();
  if(S.catFilter) list=list.filter(t=>t.cat===S.catFilter);
  const words=nq.split(' ').filter(Boolean);
  if(/^\d+([.,]\d{1,2})?$/.test(compact)){
    const c=parseCents(compact); const hasDec=/[.,]/.test(compact);
    const byAmt=list.filter(t=>hasDec ? t.amount===c : t.amount>=c && t.amount<=c+99);
    const dm=/^(\d{1,2})\.(\d{2})$/.exec(compact);
    if(!(dm && Number(dm[1])>=1 && Number(dm[1])<=31 && Number(dm[2])>=1 && Number(dm[2])<=12)) return {list:byAmt.sort(byNewest), words:[]};
    const ids=new Set(byAmt.map(t=>t.id));
    const byDate=list.filter(t=>{ const p2=t.date.split('-'); return p2[2]+'.'+p2[1]===pad(Number(dm[1]))+'.'+dm[2]; });
    for(const t of byDate) if(!ids.has(t.id)) byAmt.push(t);
    return {list:byAmt.sort(byNewest), words:[]};
  }
  const res=list.filter(t=>{
    const [y,m,d]=t.date.split('-');
    const hay=normTxt([t.note,catName(t.cat),catShort(t.cat),TYPE_WORDS[t.type],d+'.'+m,Number(d)+' '+MONTHS[Number(m)-1][1]].join(' '));
    return words.every(w=>hay.includes(w));
  }).sort(byNewest);
  return {list:res, words};
}
function renderSearch(body){
  const {list,words}=searchMatches(S.q);
  body.append(el('p','sumline',sumLine(list,true)));
  if(!list.length){ body.append(el('p','empty','Ничего не нашлось. Попробуйте часть слова, например «lid», или сумму: 12,50')); return; }
  const shown=list.slice(0,S.qLimit);
  let ym=null, chunk=[];
  const flush=()=>{ if(!chunk.length) return; const exp=chunk.filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0);
    const h=el('div','monthh'); h.append(el('div',null,ymLabel(ym))); if(exp) h.append(el('span',null,money(exp))); body.append(h); renderDayGroups(body,chunk,words); chunk=[]; };
  for(const t of shown){ const m=ymOf(t.date); if(m!==ym){ flush(); ym=m; } chunk.push(t); }
  flush();
  if(list.length>shown.length){ const b=btn('btn wide','Показать ещё',()=>{ S.qLimit+=100; render(); }); b.style.marginTop='16px'; body.append(b); }
}

    function updCats(){

    }

      panel.textContent='';
      activeCalc = st.panel==='keys' ? calc : null;
      if(st.panel==='keys'){ panel.append(keypad(calc,PAD_AMOUNT)); return; }
      if(st.panel==='cats'){ const g=el('div','catgrid'); for(const [id] of CATS[st.type]){ const b=btn(null,catShort(id),()=>{ st.cat=id; st.chip=null; st.panel='keys'; updAll(); }); b.setAttribute('aria-pressed',String(st.cat===id)); g.append(b); } panel.append(g); return; }
      if(st.panel==='date'){
        const w=el('div','stack-v');
        const q=el('div','chips');
        const dOff=n=>isoOf(new Date(now.getFullYear(),now.getMonth(),now.getDate()-n));
        for(const [l,n] of [['Сегодня',0],['Вчера',1],['Позавчера',2]]){ const v=dOff(n); const b=btn('chip',l,()=>{ st.date=v; st.panel='keys'; updAll(); }); b.setAttribute('aria-pressed',String(st.date===v)); q.append(b); }
        const f=el('div','field'); const lb=el('label',null,'Другая дата'); lb.htmlFor='shDate'; const inp=el('input','input'); inp.type='date'; inp.id='shDate'; inp.value=st.date;
        inp.addEventListener('change',()=>{ if(/^\d{4}-\d{2}-\d{2}$/.test(inp.value)){ st.date=inp.value; updDet(); } });
        f.append(lb,inp);
        w.append(q,f,btn('link','Готово',()=>{ st.panel='keys'; updAll(); }));
        panel.append(w); return;
      }
      if(st.panel==='note'){
        const w=el('div','stack-v');
        const inp=el('input','input'); inp.id='shNote'; inp.maxLength=80; inp.autocomplete='off'; inp.setAttribute('enterkeyhint','done'); inp.placeholder='Например, Lidl'; inp.value=st.note; inp.setAttribute('aria-label','Заметка');
        inp.addEventListener('input',()=>{ st.note=inp.value.slice(0,80); st.chip=null; updDet(); if(!edit) updFreqSel(); });

        const q=el('div','chips'); for(const n of recent) q.append(btn('chip ghost',n,()=>{ st.note=n; st.panel='keys'; updAll(); }));

    function updFreqSel(){ freqRow.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed','false')); }
    function updAll(){ const fk=focusKey(); updSeg(); updFreq(); updCats(); updDet(); updPanel(); updAmount(); restoreFocus(fk); }
    function save(){
      refreshToday();
      const r=calc.res(); if(r.empty||r.err) return;
      if(!/^\d{4}-\d{2}-\d{2}$/.test(st.date)) return;
      const note=(st.note||'').trim().slice(0,80);
      if(edit){
        if(st.type===tx.type && st.cat===tx.cat && r.cents===tx.amount && st.date===tx.date && note===(tx.note||'').trim().slice(0,80)){ closeSheet(); return; }
        const cur=findTx(tx.id);
        if(!cur){ closeSheet(); toast('Эту операцию удалили на другом устройстве'); return; }
        const next={id:cur.id,type:st.type,cat:st.cat,amount:r.cents,date:st.date,note,ts:cur.ts};
        const moved=ymOf(cur.date)!==ymOf(next.date); const before=clone(cur);
        updateTx(cur,next); if(!demo) setLastCat(st.type,st.cat); S.flashId=next.id; closeSheet(); render();
        toast((demo?'Пример: ':'')+'Сохранено'+(moved?' · перенесено в '+mName(ymOf(next.date),0,true):''),'Отменить',()=>{ const c2=findTx(next.id); if(c2) updateTx(c2,before); });
        return;
      }
      const t={id:uid8(),type:st.type,cat:st.cat,amount:r.cents,date:st.date,note,ts:Date.now()};
      st.saved=true; addTx(t); if(!demo) setLastCat(st.type,st.cat); S.draft=null;
      if(ymOf(t.date)!==S.cur){ S.cur=ymOf(t.date); }
      S.flashId=t.id; closeSheet(); render();
      let msg=(demo?'Пример, не сохранится: ':'Добавлено: ')+catShort(t.cat)+' · '+money(t.amount);
      if(t.date!==todayISO) msg+=' · '+relDay(t.date);
      if(t.type==='expense'){ const lim=(D().settings.budgets||{})[t.cat]; if(lim>0){ const spent=totals(ymOf(t.date)).byCat[t.cat]||0; if(spent>=0.8*lim){ msg+= spent<=lim ? ' · по лимиту осталось '+money0(lim-spent) : ' · лимит превышен на '+money0(spent-lim); } } }
      toast(msg,'Отменить',()=>{ const c2=findTx(t.id); if(c2) removeTx(c2); });
    }
    st.saveDraft=()=>{ if(edit||st.saved||demo) return; S.draft = calc.toks.length ? {type:st.type,cat:st.cat,toks:calc.toks.slice(),date:st.date,note:st.note,until:Date.now()+600000} : null; };
    updAll();
    setTimeout(()=>{ try{ d.tabIndex=-1; d.focus({preventScroll:true}); }catch(e){} },30);
  });
  SH.onClose=()=>{ if(st.saveDraft) st.saveDraft(); };
}

    sel.append(mSel,ySel); dueW.append(sel);
    f.append(dueW);
    let due = g ? (g.due||null) : null; let pick = g&&g.due ? 'pick' : (g?'none':'none');
    const opts=[['none','Без срока',null],['3','3 мес.',3],['6','6 мес.',6],['12','1 год',12],['24','2 года',24],['pick','Выбрать месяц',null]];
    function setPick(k){ pick=k; const o=opts.find(x=>x[0]===k); if(k==='none') due=null; else if(k==='pick'){ if(!due || idx(due)<idx(Cm)) due = due ? Cm : ymFromIdx(idx(Cm)+5); showSel(due); } else due=ymFromIdx(idx(Cm)+o[2]-1); drawChips(); upd(); }
    function drawChips(){ chips.textContent=''; for(const [k,l] of opts){ const b=btn('chip',l,()=>setPick(k)); b.setAttribute('aria-pressed',String(pick===k)); chips.append(b); } sel.hidden=pick!=='pick'; fixPast(); }
    function showSel(ym){ const v = idx(ym)<idx(Cm) ? Cm : ym; ySel.value=v.slice(0,4); fixPast(); mSel.value=v.slice(5); }
    function fixPast(){ for(const o of mSel.options){ o.disabled = Number(ySel.value)===now.getFullYear() && Number(o.value)<now.getMonth()+1; } }
    const onSel=()=>{ if(!ySel.value) ySel.value=String(now.getFullYear()); fixPast(); if(mSel.selectedOptions[0] && mSel.selectedOptions[0].disabled) mSel.value=pad(now.getMonth()+1); due=ySel.value+'-'+mSel.value; upd(); };
    mSel.addEventListener('change',onSel); ySel.addEventListener('change',onSel);
    // summary
    const sumBox=el('div','summary-box'); sumBox.hidden=true; const sumT=el('div'); const sumN=el('div','muted'); sumN.style.fontSize='13px'; sumBox.append(sumT,sumN); f.append(sumBox);
    // "I know how much I can save"
    const kn=btn('link','Знаю, сколько могу откладывать',()=>{ knW.hidden=!knW.hidden; });
    const knW=el('div','stack-v'); knW.hidden=true;
    const pm=mkField('gfPer','В месяц, €',{inputMode:'decimal',euro:true,placeholder:'100'});
    const knOut=el('div'); const knBtn=btn('btn','Поставить этот срок',null); knBtn.hidden=true;
    knW.append(pm.w,knOut,knBtn);
    f.append(kn,knW);
    const save=el('button','btn primary save-btn',g?'Сохранить':'Создать цель'); save.type='submit'; f.append(save);
    if(g){ const del=btn('btn danger','Удалить цель',()=>{ const cg=findGoal(id); closeSheet(); if(!cg){ render(); return; } const copy=clone(cg); removeGoal(id); toast('Цель удалена','Вернуть',()=>restoreGoal(copy)); }); f.append(del); }
    sc.append(f); d.append(sc);

    function vals(){ const T=parseCents(tg.inp.value); const B=g?g.saved:(bs.inp.value.trim()?parseCents(bs.inp.value):0); return {T,B}; }
    function upd(){
      const {T,B}=vals();
      if(!(T>0)){ sumBox.hidden=true; } else {
        sumBox.hidden=false; const rest=T-(isNaN(B)?0:B);
        if(rest<=0) sumT.textContent='Цель уже собрана';
        else if(!due) sumT.textContent='Без срока сумма в месяц не считается';
        else if(idx(due)<idx(Cm)) sumT.textContent='Срок прошёл — выберите новый месяц';
        else { const n=Math.max(1,idx(due)-idx(Cm)+1); const per=ceilEuro(rest/n);
          sumT.textContent = n===1 ? 'До конца '+mName(due,1)+': один взнос '+money0(rest)
            : (g?'Осталось '+money0(rest)+': ':'До конца '+mName(due,1,true)+': ')+n+' '+plural(n,'взнос','взноса','взносов')+' по '+money0(per); }
        const changed = g && (T!==g.target || (due||null)!==(g.due||null));
        sumN.textContent = changed && due ? 'График начнётся заново с этого месяца' : ''; sumN.hidden=!sumN.textContent;
      }
      // per-month helper
      const per=parseCents(pm.inp.value);
      if(per>0 && T>0){ const rest=T-(isNaN(B)?0:B); if(rest<=0){ knOut.textContent='Цель уже собрана'; knBtn.hidden=true; }
        else { const n=Math.ceil(rest/per); if(n>180){ knOut.textContent='Больше 15 лет: увеличьте сумму в месяц'; knBtn.hidden=true; }
          else { const nd=ymFromIdx(idx(Cm)+n-1); knOut.textContent='Соберёте к концу '+mName(nd,1,true)+' ('+n+' '+plural(n,'взнос','взноса','взносов')+')'; knBtn.hidden=false; knBtn.onclick=()=>{ due=nd; pick='pick'; mSel.value=nd.slice(5); ySel.value=nd.slice(0,4); drawChips(); upd(); }; } } }
      else { knOut.textContent=''; knBtn.hidden=true; }
    }
    for(const x of [tg.inp,bs.inp,pm.inp]) x.addEventListener('input',upd);
    f.addEventListener('submit',e=>{
      e.preventDefault();
      const name=nm.inp.value.trim(); const {T,B}=vals();
      nm.er.hidden=!!name; nm.er.textContent='Назовите цель';
      tg.er.hidden=T>0; tg.er.textContent='Укажите, сколько нужно накопить';
      if(!name || !(T>0)) return;
      if(!g){ const ng=addGoal(name.slice(0,40),T,isNaN(B)?0:Math.max(0,B),due); closeSheet(); toast((demo?'Пример: ':'')+'Цель создана'); S.flashId=ng.id; return; }
      const f2={};
      if(name!==g.name) f2.name=name.slice(0,40);
      if(T!==g.target) f2.target=T;
      if((due||null)!==(g.due||null)){ f2.due=due||null; }
      if('target' in f2 || 'due' in f2){ f2.plan = due ? {ym:Cm,base:g.saved} : null; }
      if(Object.keys(f2).length) goalEdit(id,f2);
      openGoalSheet(id); toast((demo?'Пример: ':'')+'Сохранено');
    });
    if(g && g.due){ pick='pick'; }
    drawChips(); if(pick==='pick' && due) showSel(due);
    upd();
    if(focusDue) setTimeout(()=>{ try{ chips.querySelector('button').focus(); }catch(e){} },50);
    else if(!g && !coarse()) setTimeout(()=>{ try{ nm.inp.focus(); }catch(e){} },50);
  });
}
/* reserve sheet */
function openReserveSheet(edit){
  openSheet('reserve',d=>{
    const r=D().settings.reserve||0, avg=avgExpenses(), months=avg>0?r/avg:0;
    const sc=el('div','sh-scroll'), dock=el('div','sh-dock');
    sc.append(sheetHead('Подушка безопасности'));
    if(!edit){
      sc.append(el('div','big32',money0(r)));
      const seg=el('div','segs6'); for(let i=0;i<6;i++){ const dd=el('div'); const f=Math.max(0,Math.min(1,months-i)); if(f>0){ const fi=el('i'); fi.style.width=(f*100)+'%'; dd.append(fi); } seg.append(dd); }
      sc.append(seg);
      const lb=el('div','legend'); lb.style.justifyContent='space-between'; lb.append(el('span',null,'0'),el('span',null,'3 мес. — минимум'),el('span',null,'6 мес.')); sc.append(lb);
      sc.append(el('p','muted', avg>0 ? 'Средние расходы '+money0(avg)+' в месяц. Цель — от '+money0(avg*3)+' до '+money0(avg*6)+'.' : 'Когда появятся расходы, здесь будет видно, на сколько месяцев хватит резерва.'));
      sc.append(el('p','muted','Подушка — это 3–6 месяцев обязательных расходов на отдельном счёте, с которого деньги можно снять за день.'));
      const b=btn('btn wide','Обновить сумму',()=>openReserveSheet(true)); b.style.minHeight='52px'; dock.append(b);
      d.append(sc,dock); return;
    }
    const amt=el('div','amt'); const exs=el('div','ex'); const exx=el('span'); exs.append(exx); const rs=el('output','rs'); const hint=el('div','hint'); amt.append(exs,rs,hint); sc.append(amt);
    const saveB=btn('btn primary save-btn','Сохранить',()=>{ const res=calc.res(); const v = calc.toks.length ? res.cents : 0; if(calc.toks.length && res.err && !(res.err==='Сумма должна быть больше нуля' && res.cents===0)) return; const old=D().settings.reserve||0; setReserve(Math.max(0,v)); openReserveSheet(); toast((demo?'Пример: ':'')+'Подушка обновлена','Отменить',()=>setReserve(old)); });
    const calc=Calc('amount',c=>{ const res=c.res(); exx.textContent=c.hasOps()?exprText(c):''; rs.textContent='';
      if(!c.toks.length) rs.append(el('span','zero','0')); else if(c.hasOps()) rs.append(document.createTextNode((res.approx&&!res.err?'≈ ':'')+(res.err||res.empty?'—':fmtN2.format(res.cents/100)))); else rs.append(el('span',c.replace?'rep':null,c.replace?fmtN2.format(res.cents/100):c.toks.map(showTok).join('')));
      rs.append(el('span','cur',' €'));
      const err=c.hint || (c.toks.length&&res.err&&!(res.err==='Сумма должна быть больше нуля'&&res.cents===0)?res.err:''); hint.textContent=err; hint.className='hint'+(err?' err':''); saveB.disabled=!!err; });
    calc.setCents(r,true); if(!r) calc.changed();
    activeCalc=calc;
    const panel=el('div','panel'); panel.append(keypad(calc,PAD_AMOUNT));
    dock.append(panel,saveB,btn('link','Отмена',()=>openReserveSheet()));
    d.append(sc,dock);
  });
}

/* ---------- actions ---------- */
function refreshToday(){
  const prev=todayISO; now=new Date(); todayISO=isoOf(now);
  if(todayISO===prev) return;
  if(S.cur===ymOf(prev)) S.cur=ymOf(todayISO);
  if(!$('#sheet').open) renderKeepInput();
}
let lastDeleted=null, toastTimer=null;
function dropUndo(){ lastDeleted=null; clearTimeout(toastTimer); $('#toast').hidden=true; $('#toastAct').onclick=null; }
function deleteTx(x){
  if(!removeTx(x)) return;
  lastDeleted={tx:x, demo:!!demo};
  toast((demo?'Пример: ':'')+'Операция удалена','Вернуть',()=>{ const L=lastDeleted; lastDeleted=null; if(!L || L.demo!==!!demo) return; addTx(Object.assign({},L.tx)); S.flashId=L.tx.id; render(); });
}
function toastHome(){ const w=$('#toast').parentNode, d=$('#sheet'); const inSheet=d.open && !SH.closing; const host=inSheet?d:document.body; if(w.parentNode!==host) host.append(w); $('#toast').classList.toggle('in-sheet',inSheet); }
function toast(msg,actLabel,act){
  toastHome();
  const t=$('#toast'); $('#toastMsg').textContent=msg; const b=$('#toastAct');
  const wasDemo=!!demo;
  if(actLabel){ b.hidden=false; b.textContent=actLabel; b.onclick=()=>{ t.hidden=true; if(wasDemo!==!!demo) return; act(); }; } else { b.hidden=true; b.onclick=null; }
  t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ t.hidden=true; },actLabel?10000:3500);
}
function toastErr(msg){ toast(msg); if(coarse() && document.activeElement) document.activeElement.blur(); }
function toggleDemo(){ dropUndo(); S.draft=null; if(demo){ demo=null; } else { demo=makeDemo(); S.cur=ymOf(todayISO); } S.editBud=false; dataVer++; if(isDesk()&&!demo) {} go('#/'); render(); window.scrollTo(0,0); }
function exportData(){
  const data=JSON.stringify({app:'evrobudget',v:3,exportedAt:new Date().toISOString(),months:live.months,settings:packSettings(live.settings)},null,1);
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
  a.download='evrobudget-'+todayISO+'.json'; document.body.append(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000);
  lsSet(KEY+'.lastExport',todayISO); render(); toast('Копия скачана');
}
function makeDemo(){
  const months={}; const cur=ymOf(todayISO); const lastDayCur=now.getDate();
  const spec=[['income','salary',140000,1,'Зарплата'],['saving','save',25000,1,'Автоперевод'],['expense','transport',4900,1,'Проездной'],['expense','subs',1299,8,'Стриминг'],['expense','subs',999,12,'Облако'],['expense','groceries',4420,3,'Lidl'],['expense','groceries',3275,7,'Aldi'],['expense','groceries',5130,11,'Lidl'],['expense','groceries',2860,15,'Aldi'],['expense','groceries',3990,19,'Пекарня, овощи'],['expense','groceries',2450,24,'Lidl'],['expense','cafe',2350,6,'Пицца'],['expense','cafe',480,13,'Кофе'],['expense','cafe',480,20,'Кофе'],['expense','fun',3200,10,'Кино и боулинг'],['expense','wants',3499,9,'Настольная игра'],['expense','wants',5999,16,'Наушники'],['expense','beauty',1890,17,'Крем и шампунь'],['expense','health',1250,11,'Аптека'],['expense','clothes',4500,18,'Кроссовки'],['income','side',20000,15,'Подработка']];
  for(let k=2;k>=0;k--){
    const ym=shiftYm(cur,-k); const [y,m]=ym.split('-').map(Number); const ld=new Date(y,m,0).getDate(); const arr=[];
    spec.forEach((s,i)=>{ const day=Math.min(s[3],ld); if(k===0 && day>lastDayCur) return; if(s[1]==='side' && k===1) return;
      const wobble = s[0]==='expense' && !['transport','subs','cafe'].includes(s[1]) ? 1+((i*7+k*13)%9-4)/20 : 1;
      arr.push({id:uid8(),type:s[0],cat:s[1],amount:Math.round(s[2]*wobble),date:`${ym}-${pad(day)}`,note:s[4],ts:i}); });
    months[ym]=arr;
  }
  const goals=[
    {id:'g1',name:'Отпуск в Португалии',target:150000,base:62000,ops:{},created:1,due:shiftYm(cur,5),plan:{ym:cur,base:62000}},
    {id:'g2',name:'Новый ноутбук',target:120000,base:30000,ops:{},created:2,due:shiftYm(cur,3),plan:{ym:shiftYm(cur,-2),base:10000}}
  ].map(g=>Object.assign(g,{saved:goalSaved(g)}));
  return {months, settings:{budgets:{groceries:20000,wants:10000,cafe:6000,fun:5000,clothes:5000},goals,reserve:180000}};
}

/* ---------- wiring ---------- */
$('#sIc').innerHTML=I('search',18);
$('#qClear').innerHTML=I('close',20);
$('#q').addEventListener('input',e=>{ clearTimeout(qTimer); const v=e.target.value; qTimer=setTimeout(()=>{ const had=!!S.q; S.q=v.trim(); S.qLimit=100; if(had!==!!S.q || S.q) { const r=route(); if(r.view==='ops') viewOps(r); renderChrome(); } },150); });
$('#q').addEventListener('keydown',e=>{ if(e.key==='Escape'){ e.target.value=''; S.q=''; render(); } });
$('#qClear').addEventListener('click',()=>{ $('#q').value=''; S.q=''; render(); $('#q').focus(); });
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files && e.target.files[0]; e.target.value=''; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    let parsed=null; try{ parsed=JSON.parse(String(rd.result)); }catch(err){}
    if(!parsed || typeof parsed!=='object' || !parsed.months){ toast('Это не файл копии Евробюджета.'); return; }
    const data=normalize(parsed); const n=allTxOf(data), cur=allTxOf(live), g=data.settings.goals.length;
    if(!n && !g){ toast('В файле нет ни одной операции и цели.'); return; }
    importPending={data, msg:'В файле '+n+' '+plural(n,'операция','операции','операций')+', '+g+' '+plural(g,'цель','цели','целей')+'. Сейчас '+cur+' '+plural(cur,'операция','операции','операций')+': они будут заменены данными из файла'+(C.user?' на всех ваших устройствах.':'.')};
    go('#/more/backup'); render();
  };
  rd.onerror=()=>toast('Не удалось прочитать файл.');
  rd.readAsText(f);
});
function allTxOf(d){ return Object.values(d.months).reduce((s,a)=>s+a.length,0); }
const sheetEl=$('#sheet');
sheetEl.addEventListener('cancel',e=>{ e.preventDefault(); closeSheet(); });
sheetEl.addEventListener('click',e=>{ if(e.target===sheetEl){ const r=sheetEl.getBoundingClientRect(); const x=e.clientX, y=e.clientY; if(x<r.left||x>r.right||y<r.top||y>r.bottom) closeSheet(); } });
sheetEl.addEventListener('close',()=>{ const tw=$('#toast').parentNode; if(tw.parentNode===sheetEl) document.body.append(tw); $('#toast').classList.remove('in-sheet'); if(SH.onClose){ try{ SH.onClose(); }catch(e){} SH.onClose=null; } document.documentElement.classList.remove('locked'); });
window.addEventListener('popstate',()=>{ if(sheetEl.open && SH.pushed){ SH.pushed=false; closeSheet(true); } });
window.addEventListener('hashchange',()=>{ if(sheetEl.open){ SH.pushed=false; closeSheet(true); } render(); });
window.addEventListener('scroll',onScroll,{passive:true});
if(window.visualViewport){ visualViewport.addEventListener('resize',fitSheet); visualViewport.addEventListener('scroll',fitSheet); }
let wasDesk=isDesk();
window.addEventListener('resize',()=>{ const d=isDesk(); if(d!==wasDesk){ wasDesk=d; renderKeepInput(); } });
document.addEventListener('keydown',e=>{
  const tg=e.target, tag=(tg&&tg.tagName)||'';
  const typing = tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(tg&&tg.isContentEditable);
  if(activeCalc && !typing && !e.ctrlKey && !e.metaKey && !e.altKey){
    const map={'*':'×','x':'×','X':'×','/':'÷',':':'÷','-':'−','+':'+','.':',',',':',','Backspace':'⌫','%':'%'};
    let k=null;
    if(/^[0-9]$/.test(e.key)) k=e.key; else if(map[e.key]) k=map[e.key];
    else if(e.key==='Delete'){ activeCalc.clear(); e.preventDefault(); return; }
    else if(e.key==='Enter'){ if(tg && tg.tagName==='BUTTON' && !tg.classList.contains('key') && !(sheetEl.open && tg.closest('#sheet .seg')) && !(activeCalc.mode==='calc' && !tg.closest('#v-more'))) return; if(sheetEl.open){ const sb=sheetEl.querySelector('.save-btn'); if(sb && !sb.disabled){ e.preventDefault(); sb.click(); } } else if(activeCalc.mode==='calc'){ e.preventDefault(); activeCalc.press('='); } return; }
    else if(e.key==='='&&activeCalc.mode==='calc') k='=';
    else if(e.key==='Escape' && !sheetEl.open && activeCalc.mode==='calc'){ activeCalc.clear(); return; }
    if(k){ e.preventDefault(); activeCalc.press(k); return; }
  }
  if(sheetEl.open || typing || e.ctrlKey || e.metaKey || e.altKey) return;
  const r=route();
  if(e.key==='Delete' && tg && tg.classList && tg.classList.contains('row') && tg.dataset.id){ const t=findTx(tg.dataset.id); if(t){ e.preventDefault(); deleteTx(t); } return; }
  if(e.key==='n'||e.key==='N'||e.key==='т'||e.key==='Т'){ e.preventDefault(); openTxSheet(null); }
  else if(e.key==='/'){ e.preventDefault(); go('#/ops'); setTimeout(()=>$('#q').focus(),0); }
  else if((e.key==='ArrowLeft'||e.key==='ArrowRight') && (r.view==='home'||r.view==='ops') && !S.q){ S.cur=shiftYm(S.cur,e.key==='ArrowLeft'?-1:1); render(); }
});
document.addEventListener('paste',e=>{
  if(!activeCalc) return; const tg=e.target, tag=(tg&&tg.tagName)||''; if(tag==='INPUT'||tag==='TEXTAREA') return;
  const txt=(e.clipboardData&&e.clipboardData.getData('text'))||''; const c=parseCents(txt);
  e.preventDefault();
  if(c>0){ activeCalc.setCents(c,false); return; }
  const s=txt.replace(/\s/g,'');
  if(/^[\d.,+\-*/×÷−:x]+$/.test(s)){ activeCalc.clear(); for(const ch of s){ const k={'*':'×','x':'×','/':'÷',':':'÷','-':'−','.':','}[ch]||ch; activeCalc.press(k); } return; }
  activeCalc.flash('Не похоже на сумму'); activeCalc.changed();
});

function init(){
  if('scrollRestoration' in history) history.scrollRestoration='manual';
  if(history.state && history.state.sheet) history.replaceState(null,'');
  lsDel('evrobudget.sync');
  loadLocal();
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
  render();
  window.addEventListener('storage',e=>{ if(e.key===KEY && !C.user){ loadLocal(); renderKeepInput(); } });
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') refreshToday(); });
  window.addEventListener('pageshow',refreshToday);
  window.addEventListener('focus',refreshToday);
  window.addEventListener('online',renderChrome);
  window.addEventListener('offline',renderChrome);
  setInterval(refreshToday,60000);
  setTimeout(()=>{ S.flashId=null; },1500);
  initCloud();
  if('serviceWorker' in navigator && location.protocol==='https:'){ addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{})); }
}
init();
setInterval(()=>{ if(S.flashId) S.flashId=null; },1600);
})();
